name: Validate pack

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install Packwiz
        run: go install github.com/packwiz/packwiz@latest
      - name: Validate Packwiz metadata
        run: |
          "$(go env GOPATH)/bin/packwiz" refresh
          git diff --exit-code -- pack.toml index.toml
      - name: Validate Modrinth export
        run: |
          "$(go env GOPATH)/bin/packwiz" modrinth export \
            --output /tmp/our-little-world-validation.mrpack
          python3 scripts/externalize_modrinth_file.py \
            /tmp/our-little-world-validation.mrpack \
            mods/unified-xaero-worldmap.pw.toml
          unzip -t /tmp/our-little-world-validation.mrpack
      - name: Test Fabulously Optimized synchronization
        run: python3 -m unittest discover -s tests -v
