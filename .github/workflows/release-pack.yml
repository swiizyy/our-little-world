name: Release modpack

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install Packwiz
        run: |
          go install github.com/packwiz/packwiz@v0.0.0-20261014010756-170b22d78595
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify and build the tagged pack
        run: |
          python -m unittest discover -s tests -v
          packwiz refresh
          git diff --exit-code -- pack.toml index.toml
          python scripts/build_pack.py --tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: release-pack
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-pack
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            mkdir previous
            gh release download "$GITHUB_REF_NAME" --pattern pack-manifest.json --dir previous
            cmp previous/pack-manifest.json pack-manifest.json
            exit 0
          fi
          flags=(--prerelease)
          if [[ "$(jq -r .channel pack-manifest.json)" == "release" ]]; then
            flags=(--latest)
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag "${flags[@]}" \
            --title "Our Little World $(jq -r .version pack-manifest.json)" \
            --notes-file release-notes.md \
            our-little-world.mrpack pack-manifest.json client-defaults.zip
